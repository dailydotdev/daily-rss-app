version: 2.1
jobs:
  deploy:
    docker:
      - image: cimg/node:24.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: |
            sudo npm install -g corepack@0.31.0
            sudo corepack enable
            pnpm config set store-dir .pnpm-store
      - restore_cache:
          keys:
            - dependencies-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: dependencies-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .pnpm-store
      - run:
          name: Typecheck
          command: pnpm run typecheck
      - run:
          name: Deploy
          command: pnpm run deploy
workflows:
  deploy:
    jobs:
      - deploy:
          context: CLOUDFLARE
          filters:
            branches:
              only: main
